model:
  name_or_path: /data1/liujianjian/model/Meta-Llama-3.1-8B-Instruct
  local_files_only: true
  trust_remote_code: true
  load_in_4bit_training: true
  device_map: auto

architecture:
  goal_queries: 8
  belief_queries: 4
  desire_queries: 4
  controller_hidden: 512

lora:
  weaver:
    rank: 16
    alpha: 32
    dropout: 0.1
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  trigger:
    rank: 8
    alpha: 16
    dropout: 0.1
    target_modules: [q_proj, k_proj, v_proj, o_proj]

data:
  max_goal_tokens: 256
  max_prompt_tokens: 1024
  max_target_tokens: 192

training:
  seed: 42
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  # The latent Weaver calls the decoder multiple times with different prefix
  # lengths (goal-only, goal+state, and reasoner).  Transformers' non-
  # reentrant checkpoint metadata check is incompatible with that adapter
  # switching path; 4-bit Llama-3.1-8B fits the 24GB 3090 without it.
  gradient_checkpointing: false
  num_workers: 0
  lora_lr: 1.0e-5
  module_lr: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_epochs: 2
  trajectory_epochs: 3
  warmup_language_weight: 0.5
  warmup_route_weight: 1.0
  warmup_action_weight: 1.0
  language_weight: 1.0
  route_weight: 0.25
  action_weight: 0.25
  belief_weight: 0.20
  desire_weight: 0.20
  goal_alignment_weight: 0.30
  drift_target_language_weight: 0.0

trigger_training:
  epochs: 2
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_workers: 0

dpo:
  beta: 0.1
  epochs: 1
  learning_rate: 5.0e-6
