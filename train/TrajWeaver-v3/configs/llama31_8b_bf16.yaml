model:
  name_or_path: /data1/liujianjian/model/Meta-Llama-3.1-8B-Instruct
  load_in_4bit: false
  device_map: auto
architecture:
  goal_tokens: 8
  state_tokens: 8
  trigger_hidden: 128
lora:
  rank: 16
  alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
data:
  max_goal_tokens: 512
  max_prompt_tokens: 4096
  max_target_tokens: 512
training:
  seed: 42
  sft:
    epochs: 2
    gradient_accumulation: 16
    learning_rate: 0.00001
    goal_only_weight: 0.25
  trigger:
    epochs: 3
    gradient_accumulation: 16
    learning_rate: 0.0001
utility:
  cost: 0.01
  margin: 0.002
